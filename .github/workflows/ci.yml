name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # run by hand (Actions tab), e.g. to redeploy main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # main deploys: never cut one off

jobs:
  ts:
    name: TypeScript (typecheck, tests, web build)
    runs-on: ubuntu-latest      # no secrets: tests mock NEAR AI and the chain
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build

  rust:
    name: Contracts (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [contract, shirts]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo test
      - run: cargo check --target wasm32-unknown-unknown

  deploy-brain:
    name: Deploy brain to the droplet
    # main only, and only after every test above passed. The web deploys through Vercel's GitHub integration.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ts, rust]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-brain
      cancel-in-progress: false   # never stop a deploy half way
    steps:
      - uses: actions/checkout@v4
      - name: SSH key for the droplet
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DROPLET_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # KEEP_ENV: the brain env (keys, secrets) stays on the server, never in GitHub
      - run: KEEP_ENV=1 ./scripts/deploy-droplet.sh "${{ secrets.DROPLET_HOST }}" - api.mypetto.xyz
